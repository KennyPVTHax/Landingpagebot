name: Import owner-template v3 source
on:
  push:
    branches: [main]
    paths:
      - '.source-transfer/READY'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source-transfer/part-*.b64 | base64 -d > /tmp/release-bundle.tar.xz
          echo "627b69fe86bec2f427a529b819c02f387e33e9a470fc0aa2abd6512ba4961a25  /tmp/release-bundle.tar.xz" | sha256sum --check
          tar -tJf /tmp/release-bundle.tar.xz > /tmp/listing
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/listing; then
            echo 'Unsafe paths in archive'; exit 1
          fi
          rm -f tests/test_skeleton.py
          tar -xJf /tmp/release-bundle.tar.xz
          rm -rf .source-transfer
          rm -f .github/workflows/import-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Import owner-provided templates and APK autolink v3"
            git push origin HEAD:main
          fi
